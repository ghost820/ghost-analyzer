[workspace]
resolver = "2"
members = ["crates/ghost-dsp", "crates/ghost-engine", "crates/ghost-bridge"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[workspace.dependencies]
num-complex = { version = "0.4", features = ["bytemuck"] }
rustfft = "6.4"
bytemuck = "1"
ghost-dsp = { path = "crates/ghost-dsp" }
ghost-engine = { path = "crates/ghost-engine" }

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3
